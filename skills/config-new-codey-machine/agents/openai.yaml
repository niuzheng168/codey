interface:
  display_name: "Install Codey node"
  short_description: "三平台安装节点、自动接入升级器并生成 Portal 注册 JSON"
  default_prompt: "使用 $config-new-codey-machine，按真实系统运行完整入口：Linux install-npm.sh、Windows install.ps1、macOS install-macos.py；自动安装启动本机升级器并验证原用户 Home 下的 codey-machine-registration.json 后才报告完成。上传一次 JSON 同时绑定节点和升级器，不要求用户再手动接入升级器。"
