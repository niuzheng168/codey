interface:
  display_name: "Config new Codey machine"
  short_description: "DevTunnel、copilot-api、Codex、CloudCLI 一键覆盖"
  default_prompt: "使用 $config-new-codey-machine。在 Linux 目标普通用户下直接运行 bash scripts/setup-linux.sh --apply：配置 GitHub DevTunnel，停止并归档已有 Codey 守护进程，覆盖安装并登录 copilot-api，停止旧 Codex 进程并用官方 installer 更新到 latest，写入模型配置并做真实请求，最后覆盖安装 CloudCLI、创建 systemd 守护和升级器并验收。保留 Home、.codex、auth 和 sessions。"
