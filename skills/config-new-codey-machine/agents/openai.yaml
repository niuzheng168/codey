interface:
  display_name: "Install Codey on Linux"
  short_description: "一条 Bash 命令覆盖安装并启动 Codey"
  default_prompt: "使用 $config-new-codey-machine，在目标 Linux x64 普通用户下运行 bash scripts/install.sh。按 1-6 步直接覆盖旧 DevTunnel、copilot-api、Codex、CloudCLI 和 updater；Node、Codex、DevTunnel 从官方源下载，包内只使用 CloudCLI、copilot-api、updater 三个 payload。"