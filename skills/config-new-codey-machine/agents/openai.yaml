interface:
  display_name: "Config new Codey machine"
  short_description: "五步覆盖安装并配置更新守护"
  default_prompt: "使用 $config-new-codey-machine。在 Linux 目标普通用户下直接运行 bash scripts/setup-linux.sh --apply，严格按五步完成：GitHub DevTunnel；覆盖安装、登录并测试 copilot-api；停止旧 Codex 并用官方 installer 更新到 latest、写配置和真实测试；覆盖安装并测试 CloudCLI；安装独立 updater、启用所有 systemd 守护和 owner linger。保留 Home、.codex、auth 和 sessions。"
